services:
    db:
      image: postgres:17
      container_name: dramalytics-db

      environment:
       POSTGRES_DB: ${POSTGRES_DB}
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


      ports:
      - "5433:5432"

      volumes:
      - postgres_data:/var/lib/postgresql/data

    api:
      build: .
      container_name: dramalytics-api

      env_file:
       - .env

      ports:
         - "8000:8000"


      depends_on:
         - db

volumes:
    postgres_data: